      '<div class="cause rem"><div class="cause-btn static"><span class="stack-6 grow"><b>' + (done ? "Explained with a note" : "Not explained yet") + '</b><span class="tags">' + (done ? tag("explained") : '<span class="tag tag-warn">' + ic("alert", 12) + "No record</span>") + '</span></span><span class="num under">−$0.33</span><span style="width:20px"></span></div>' +
      (done ? "" : '<p class="cap rem-text">No processor record covers this. Ask Stripe for the records, or explain it in a note.</p>') + "</div>";
    var notes = S.atNotes.map(function (n) { return '<div class="note"><b>Maya Chen · just now</b><br>' + esc(n) + "</div>"; }).join("");
    var foot = done ? '<a class="btn btn-primary btn-full" href="#home">Back to home</a>' : hasNote ? '<button type="button" class="btn btn-primary btn-full" data-act="atOpenSheet">Mark as explained</button>' : '<button type="button" class="btn btn-primary btn-full" disabled>Add a note to explain −$0.33</button>';
    var sheet = S.atSheet ? sheetWrap("atCloseSheet", "at-t", '<h2 id="at-t" class="h2 lg">Close with a note?</h2><p class="body2">$3.84 is backed by records. The other $0.33 rests on your note, so it’s logged as <b>Explained with a note</b>. No amounts change.</p><div class="kv">Fee −$2.53 · conversion −$1.31 (Likely) · your note −$0.33</div>' +
      '<label class="ack"><input type="checkbox" data-act="atAck"' + (S.atAck ? " checked" : "") + "><span>I’m confident in this explanation and accept it isn’t fully backed by records.</span></label>" +
      '<button type="button" class="btn btn-primary btn-full" data-act="atConfirm"' + (S.atAck ? "" : " disabled") + '>Mark as explained</button><button type="button" class="btn btn-tertiary btn-full" data-act="atCloseSheet">Cancel</button>') : "";
    return '<div class="scroll"><nav class="between center-y topnav"><a class="iconbtn" href="#payouts" aria-label="Back to payouts">' + ic("back", 24) + '</a><span class="cap">PO-30241</span><span style="width:36px"></span></nav>' +
      (done ? banner("positive", "Explained with a note.", "Logged in the audit trail with your reason.") : "") +
      '<header class="stack-8">' + tag(r.status) + '<h1 class="h2 lg">Atlas Map Prints</h1><span class="num display under">−$4.17</span><p class="cap">Expected $924.93 · recorded $920.76. One fee, one currency conversion, and $0.33 nobody can source yet.</p></header>' +
      (done ? "" : banner("warning", "Causes cover −$3.84 of −$4.17.", "Reconcile won’t mark this explained until the last $0.33 has a reason.")) +
      '<section><h2 class="h2">Why it differs</h2><div class="causes">' + causes + '</div><p class="cap mt12">' + (done ? "Causes and note net to −$4.17 ✓" : "Causes net to −$3.84 · −$0.33 left") + "</p></section>" +
      '<section class="stack-12"><h2 class="h2">Case</h2><div class="kv line"><b>Owner</b>' + (S.mine["PO-30241"] ? '<span class="muted">You (Maya Chen)</span>' : '<button type="button" class="btn btn-accent btn-compact" data-act="takeId" data-id="PO-30241">Assign to me</button>') + "</div>" +
      '<div class="kv line tall"><span><b>Processor records</b><span class="cap block">' + (S.atReq ? "Requested Nov 10. The reply attaches here." : "Ask Stripe for the records behind −$0.33") + "</span></span>" + (S.atReq ? tag("investigating") : '<button type="button" class="btn btn-secondary btn-compact" data-act="atReq"' + (done ? " disabled" : "") + ">Request</button>") + "</div>" +
      notes + (done ? "" : '<label for="atnote" class="s14"><b>Add a note</b></label><textarea id="atnote" data-input="atDraft" placeholder="Why is the last $0.33 off?">' + esc(S.atDraft) + '</textarea><button type="button" class="btn btn-secondary btn-full" data-act="atPost"' + (S.atDraft.trim() ? "" : " disabled") + ">Post note</button>") + "</section>" +
      banner("info", "Read-only records.", "Investigating never edits charges, fees, transfers or payouts.") + "</div>" +
      '<div class="footer">' + foot + "</div>" + sheet;
  }

  // ---------- render / routing ----------
  var app = document.getElementById("app"), lastRoute = null;
  function route() { var h = (location.hash || "").replace("#", ""); return ["splash", "onboard", "home", "payouts", "investigate", "atlas", "cases"].indexOf(h) > -1 ? h : "splash"; }
  function render() {
    var r = route(), sc = app.querySelector(".scroll"), top = sc && lastRoute === r ? sc.scrollTop : 0;
    var a = document.activeElement, fid = a && a.id, pos = a && a.selectionStart;
    var html = { splash: splash, onboard: onboard, home: home, payouts: payouts, investigate: investigate, atlas: atlas, cases: cases }[r]();
    app.innerHTML = '<div class="screen' + (r === "splash" ? " dark" : "") + '">' + html + (S.toast ? '<div class="toast" role="status">' + S.toast + "</div>" : "") + "</div>";
    var sc2 = app.querySelector(".scroll"); if (sc2) sc2.scrollTop = top;
    if (fid) { var el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
    var dlg = app.querySelector(".sheet"); if (dlg && !app.querySelector(".sheet :focus")) { var f = dlg.querySelector("button:not(.scrim), a, input, select"); if (f && !fid) f.focus({ preventScroll: true }); }
    lastRoute = r;
    document.title = { splash: "Reconcile", onboard: "Set up · Reconcile", home: "Home · Reconcile", payouts: "Payouts · Reconcile", investigate: "PO-30227 · Reconcile", atlas: "PO-30241 · Reconcile", cases: "Cases · Reconcile" }[r];
    save(); runSync();
  }
  function assign(id) {
    if (id === "PO-30221" && !S.lost[id]) { S.lost[id] = true; toast("Daniel Okafor took Lumen Glassworks a moment ago. It’s in All open."); return; }
    S.mine[id] = true; toast(D[id].seller + " assigned to you");
  }
  var toastTimer;
  function toast(msg) { S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(function () { S.toast = ""; render(); }, 2600); }
  function set(patch) { Object.assign(S, patch); render(); }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var a = t.getAttribute("data-act"), k = t.getAttribute("data-k"), id = t.getAttribute("data-id");
    switch (a) {
      case "start": location.hash = "#onboard"; set({ ob: S.onboarded ? 0 : -1, slide: 0 }); break;
      case "haveAcct": location.hash = "#onboard"; set({ ob: 0, onboarded: true }); break;
      case "slide": set({ slide: +k }); break;
      case "skipIntro": set({ ob: 0 }); break;
      case "obBack": set({ ob: S.ob === 0 ? -1 : S.ob - 1, sync: S.ob === 5 ? 0 : S.sync }); break;
      case "obNext":
        if (S.ob === 4) { var c = Object.keys(S.invited).filter(function (x) { return S.invited[x]; }).length; if (c) toast(c + " invite" + (c > 1 ? "s" : "") + " sent"); }
        set({ ob: S.ob + 1, sync: S.ob + 1 === 5 ? 0 : S.sync }); break;
      case "google": S.email = "maya@fernhill.co"; toast("Signed in as maya@fernhill.co"); if (S.onboarded) { location.hash = "#home"; } else set({ ob: 1 }); break;
      case "signin": if (S.onboarded) { toast("Welcome back, Maya"); S.pw = ""; location.hash = "#home"; } else { toast("Workspace created"); set({ ob: 1, pw: "" }); } break;
      case "connect": set({ connecting: k, connBusy: false }); break;
      case "closeConn": set({ connecting: "", connBusy: false }); break;
      case "authorize":
        set({ connBusy: true });
        setTimeout(function () { var key = S.connecting; if (!key) return; var isP = PROCS.some(function (p) { return p[0] === key; }); if (isP) S.proc[key] = true; else S.ledger = key; var nm = PROCS.concat(LEDGERS).filter(function (p) { return p[0] === key; })[0][1]; toast(key === "csv" ? "144 expected payouts loaded" : nm + " connected"); set({ connecting: "", connBusy: false }); }, 1100); break;
      case "tol": set({ tol: k }); break;
      case "timingOn": set({ timingOn: !S.timingOn }); break;
      case "invite": S.invited[k] = !S.invited[k]; set({}); break;
      case "addInvite": var em = S.invEmail.trim().toLowerCase(); if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { if (S.extra.indexOf(em) < 0) S.extra.push(em); S.invited[em] = true; set({ invEmail: "" }); } break;
      case "finishOb": S.onboarded = true; S.ob = 0; location.hash = "#home"; toast("Welcome to Reconcile"); break;
      case "sel": set({ sel: id }); break;
      case "atCause": S.atOpen[k] = !S.atOpen[k]; set({}); break;
      case "atReq": toast("Request sent to Stripe support"); set({ atReq: true }); break;
      case "atPost": if (S.atDraft.trim()) { S.atNotes.push(S.atDraft.trim()); toast("Note added. You can close the case now."); set({ atDraft: "" }); } break;
      case "atOpenSheet": set({ atSheet: true, atAck: false }); break;
      case "atCloseSheet": set({ atSheet: false }); break;
      case "atAck": set({ atAck: t.checked }); break;
      case "atConfirm": if (S.atAck) { toast("PO-30241 explained with a note"); set({ atSheet: false, atExplained: true }); } break;
      case "ruleOpen": set({ ruleSheet: true }); break;
      case "ruleClose": set({ ruleSheet: false }); break;
      case "ruleNo": toast("Okay. We’ll ask again if it keeps happening."); set({ ruleNo: true }); break;
      case "ruleOn": toast("Rule on. It starts with the Nov 11 payouts."); set({ rule: true, ruleSheet: false }); break;
      case "closeSel": set({ sel: null }); break;
      case "take": assign(S.sel); set({}); break;
      case "takeId": assign(id); set({}); break;
      case "acct": set({ acct: true }); break;
      case "closeAcct": set({ acct: false }); break;
      case "notif": set({ notif: !S.notif }); break;
      case "signout": S.acct = false; S.ob = 0; S.pw = ""; break;
      case "restart": e.preventDefault(); clearTimeout(syncTimer); S = fresh(); save(); location.hash = "#splash"; render(); break;
      case "toggleOpen": set({ showOpen: !S.showOpen, showTiming: false }); break;
      case "toggleTiming": set({ showTiming: !S.showTiming, showOpen: false }); break;
      case "filter": set({ payFilter: k }); break;
      case "clearQ": set({ q: "" }); document.getElementById("q") && document.getElementById("q").focus(); break;
      case "resetFilters": set({ q: "", payFilter: "all" }); break;
      case "caseView": set({ caseView: k }); break;
      case "cause": S.open[k] = !S.open[k]; set({}); break;
      case "post": if (S.draft.trim()) { S.notes.push(S.draft.trim()); toast("Note added"); set({ draft: "" }); } break;
      case "openSheet": set({ sheet: true, ack: false }); break;
      case "closeSheet": set({ sheet: false }); break;
      case "ack": set({ ack: t.checked }); break;
      case "confirm": if (S.ack) { toast("PO-30227 marked as explained"); set({ sheet: false, explained: true }); } break;
    }
  });
  app.addEventListener("input", function (e) {
    var k = e.target.getAttribute("data-input"); if (!k) return;
    S[k] = e.target.value;
    if (k === "q") render();
    if (k === "email" || k === "pw" || k === "invEmail") render();
    if (k === "atDraft") { var b2 = app.querySelector('[data-act="atPost"]'); if (b2) b2.disabled = !S.atDraft.trim(); save(); }
    if (k === "draft") { var b = app.querySelector('[data-act="post"]'); if (b) b.disabled = !S.draft.trim(); save(); }
  });
  app.addEventListener("change", function (e) {
    if (e.target.getAttribute("data-input") === "tz") { S.tz = e.target.value; render(); return; }
    if (e.target.getAttribute("data-input") === "owner") { S.owner = e.target.value; toast(S.owner ? "Owner: " + S.owner : "Owner removed"); render(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (S.ruleSheet) set({ ruleSheet: false }); else if (S.atSheet) set({ atSheet: false }); else if (S.connecting) set({ connecting: "", connBusy: false }); else if (S.sheet) set({ sheet: false }); else if (S.sel) set({ sel: null }); else if (S.acct) set({ acct: false });
  });
  window.addEventListener("hashchange", function () { S.sel = null; S.acct = false; S.sheet = false; S.connecting = ""; S.atSheet = false; S.ruleSheet = false; render(); });
  render();
})();

</script>
